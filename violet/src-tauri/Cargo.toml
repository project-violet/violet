[package]
name = "violet-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Violet cross-platform local application"

[lib]
name = "violet_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rquickjs = "0.9"
chrono = "0.4"
sha2 = "0.10"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "ios")'.dependencies]
# rquickjs 0.9 does not ship bindings for aarch64-apple-ios-sim.
rquickjs = { version = "0.9", features = ["bindgen"] }
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = ["UIGeometry", "objc2-core-foundation"] }
tokio = { version = "1", features = ["sync"] }

[patch.crates-io]
swift-rs = { path = "../vendor/swift-rs" }
